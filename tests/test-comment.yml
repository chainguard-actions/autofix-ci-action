name: Test custom comment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          comment: "autofix.ci has automatically fixed formatting issues."
        continue-on-error: true

      - name: Assert action handled comment input
        env:
          AUTOFIX_STARTED: ${{ steps.action.outputs.autofix_started }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "autofix_started: $AUTOFIX_STARTED"
          # The action runs in a non-PR context (workflow_dispatch), so it should
          # either succeed with autofix_started=false or fail gracefully.
          # The comment input should be accepted without error.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$AUTOFIX_STARTED" = "true" ]; then
              echo "FAIL: autofix_started should not be true in a non-PR context"
              exit 1
            fi
            echo "PASS: action accepted comment input, autofix_started=$AUTOFIX_STARTED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in non-PR context (expected)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
