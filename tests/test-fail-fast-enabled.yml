name: Test fail-fast enabled (default behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          fail-fast: 'true'
        continue-on-error: true
      - name: Assert action ran with fail-fast enabled
        env:
          AUTOFIX_STARTED: ${{ steps.action.outputs.autofix_started }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "autofix_started: $AUTOFIX_STARTED"
          # The action may fail or succeed depending on the context (not a PR),
          # but if it succeeds the output should be a boolean string
          if [ "$OUTCOME" = "success" ]; then
            if [ "$AUTOFIX_STARTED" != "true" ] && [ "$AUTOFIX_STARTED" != "false" ]; then
              echo "FAIL: autofix_started output should be 'true' or 'false', got: '$AUTOFIX_STARTED'"
              exit 1
            fi
            echo "PASS: autofix_started=$AUTOFIX_STARTED"
          else
            echo "INFO: action did not succeed (expected outside PR context), outcome=$OUTCOME"
            echo "PASS: action ran as expected with fail-fast=true"
          fi
