name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert autofix_started output is set
        env:
          AUTOFIX_STARTED: ${{ steps.action.outputs.autofix_started }}
        run: |
          echo "autofix_started: $AUTOFIX_STARTED"
          # The action should produce a boolean output (true or false)
          # In a local act environment without a real PR, it will be false or empty
          if [ "$AUTOFIX_STARTED" = "true" ] || [ "$AUTOFIX_STARTED" = "false" ] || [ -z "$AUTOFIX_STARTED" ]; then
            echo "PASS: autofix_started output is valid (got: '$AUTOFIX_STARTED')"
          else
            echo "FAIL: unexpected value for autofix_started: '$AUTOFIX_STARTED'"
            exit 1
          fi
