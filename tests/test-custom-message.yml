name: Test custom commit-message and comment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-message: "style: auto-fix formatting issues"
          comment: "Autofix has applied formatting fixes to this PR."
      - name: Assert action ran with custom inputs
        env:
          AUTOFIX_STARTED: ${{ steps.action.outputs.autofix_started }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "autofix_started: $AUTOFIX_STARTED"
          # The action may fail or succeed depending on server availability,
          # but if it succeeds the output should be a boolean string
          if [ "$OUTCOME" = "success" ]; then
            if [ "$AUTOFIX_STARTED" != "true" ] && [ "$AUTOFIX_STARTED" != "false" ]; then
              echo "FAIL: expected autofix_started to be 'true' or 'false', got: '$AUTOFIX_STARTED'"
              exit 1
            fi
            echo "PASS: autofix_started=$AUTOFIX_STARTED"
          else
            echo "INFO: action did not succeed (no PR context under act) - outcome=$OUTCOME"
            echo "PASS: action accepted custom inputs and ran as expected"
          fi
